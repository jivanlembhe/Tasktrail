name: Build TaskTrail for Windows

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'python/**'
      - '.github/workflows/build-python.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Bundle XLSX library
        shell: pwsh
        run: |
          if (Test-Path "node_modules/xlsx/dist/xlsx.full.min.js") {
            Copy-Item "node_modules/xlsx/dist/xlsx.full.min.js" "src/xlsx.full.min.js" -Force
          }

      - name: Build Windows installers
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: TaskTrail-Setup-${{ github.run_number }}
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload Portable exe
        uses: actions/upload-artifact@v4
        with:
          name: TaskTrail-Portable-${{ github.run_number }}
          path: dist/*Portable*.exe
          if-no-files-found: error
